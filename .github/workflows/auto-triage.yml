name: Daily ticket auto-triage

# Runs once a day, 07:30 MT (14:30 UTC) — 30 minutes after the
# /api/cron/feedback-digest cron has emailed Andrew the open queue.
# Also manually triggerable from the Actions tab so a maintainer can
# kick off a fresh pass without waiting for the schedule (useful when
# the backlog has piled up).
#
# Required GitHub repo secrets:
#   ANTHROPIC_API_KEY  — your Anthropic console API key
#   CRON_SECRET        — same secret already in Vercel; lets us call
#                        /api/cron/feedback-list authenticated

on:
  schedule:
    - cron: "30 14 * * *"
  workflow_dispatch:
    inputs:
      max_prs:
        description: "Cap PRs created this run"
        required: false
        default: "5"
      ticket_id:
        description: "Optional single ticket id to triage (leave blank to attempt the whole backlog)"
        required: false
        default: ""

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    env:
      ATLAS_BASE_URL: https://fuzeatlas.com
      MAX_AUTO_PRS: ${{ github.event.inputs.max_prs || '5' }}
      SINGLE_TICKET_ID: ${{ github.event.inputs.ticket_id || '' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      # ────────────────────────────────────────────────────────────
      # 1. Verify required secrets up-front. The old workflow ran
      # silently with a missing API key — the action would no-op and
      # nothing landed. Fail loud now.
      # ────────────────────────────────────────────────────────────
      - name: Verify required secrets
        id: secrets_check
        run: |
          MISSING=""
          if [ -z "${{ secrets.ANTHROPIC_API_KEY }}" ]; then MISSING="$MISSING ANTHROPIC_API_KEY"; fi
          if [ -z "${{ secrets.CRON_SECRET }}" ]; then MISSING="$MISSING CRON_SECRET"; fi
          if [ -n "$MISSING" ]; then
            echo "::error::Missing repo secrets:$MISSING — set them at Settings → Secrets and variables → Actions."
            exit 1
          fi
          echo "All required secrets present (ANTHROPIC_API_KEY, CRON_SECRET)."
          echo "Tip — to rotate either secret, paste a new value via gh CLI:"
          echo "  gh secret set ANTHROPIC_API_KEY -b 'sk-ant-...'"
          echo "  gh secret set CRON_SECRET     -b '<vercel cron secret>'"

      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      # ────────────────────────────────────────────────────────────
      # 2. Pull live open-ticket queue. Honest about failures here —
      # if the API returned non-2xx, dump the body so the Actions log
      # tells us what went wrong instead of just "step failed."
      # ────────────────────────────────────────────────────────────
      - name: Fetch open tickets
        id: fetch
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/triage
          HTTP_CODE=$(curl -sS -o /tmp/triage/tickets.json -w "%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$ATLAS_BASE_URL/api/cron/feedback-list?status=NEW&limit=50")
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::feedback-list returned HTTP $HTTP_CODE"
            cat /tmp/triage/tickets.json
            exit 1
          fi
          # If workflow_dispatch passed a single ticket id, filter the
          # payload down to it so the rest of the run only deals with
          # that one ticket. Helpful for testing the chain end-to-end.
          if [ -n "$SINGLE_TICKET_ID" ]; then
            jq --arg id "$SINGLE_TICKET_ID" '{reports: [.reports[] | select(.id == $id)]}' \
              /tmp/triage/tickets.json > /tmp/triage/tickets-filtered.json
            mv /tmp/triage/tickets-filtered.json /tmp/triage/tickets.json
            echo "Filtered to ticket id $SINGLE_TICKET_ID"
          fi
          NEW_COUNT=$(jq '.reports | length' /tmp/triage/tickets.json)
          echo "newCount=$NEW_COUNT" >> "$GITHUB_OUTPUT"
          echo "Fetched $NEW_COUNT NEW tickets."

      - name: Skip when nothing to do
        if: steps.fetch.outputs.newCount == '0'
        run: |
          echo "No NEW tickets — exiting cleanly."

      # ────────────────────────────────────────────────────────────
      # 3. The Claude Code agent — relaxed triage prompt.
      # Previously skipped everything not BROKEN_LINK/ERROR/PROBLEM
      # with a concrete file path → exhausted whole backlogs.
      # Now: attempt BUG/ERROR/PROBLEM with any context + SUGGESTION
      # tickets that are clearly small UI/copy nudges; only skip
      # OTHER, ACCEPTED-parked, and one-sentence-ambiguous tickets.
      # ────────────────────────────────────────────────────────────
      # The official action is published as
      # https://github.com/anthropics/claude-code-action with a `beta`
      # tag — there is no v1 tag. The old workflow's `@v1` reference
      # was the root cause of 27 consecutive red runs since 2026-05-27:
      # GitHub Actions silently retries a missing tag a few times,
      # logs an error, and fails the job in <60s. Always pin to a
      # real ref (beta is the canonical floating tag the
      # marketplace listing recommends).
      - name: Claude Code — attempt fixes
        id: claude
        if: steps.fetch.outputs.newCount != '0'
        uses: anthropics/claude-code-action@beta
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          model: claude-sonnet-4-6
          prompt: |
            You are running daily ticket auto-triage for FUZE Atlas.

            BEFORE YOU TOUCH CODE:
            1. Read /CLAUDE.md end to end. Brand-voice rules (FUZE,
               metamaterial — never silver/nano), Next.js 15 gotchas,
               canonical product voice in src/lib/fuze-knowledge.ts.
            2. Read the ticket payload at /tmp/triage/tickets.json.
               Each item has: id, title, description, category,
               status, url (page they were on), portal, userEmail,
               userRole.

            FIXING RULES (RELAXED 2026-06-04):
            - ATTEMPT tickets whose category is BUG, BROKEN_LINK,
              ERROR, PROBLEM (these are obvious targets), OR
              SUGGESTION ones that are clearly small UI/copy nudges
              (button label, missing tooltip, layout twitch, color
              fix, etc).
            - SKIP only when:
                - category is OTHER, or status is ACCEPTED-parked
                - description is < 20 chars AND no other context (no
                  url, no portal)
                - the change would require backend/schema work AND
                  no concrete file/route is named
            - When the ticket gives a URL but no file path, navigate
              the repo and find the page yourself (the URL is enough
              context). DO NOT skip just because a file isn't named.
            - Cap at $MAX_AUTO_PRS tickets per run. Quality > volume.
            - For each ticket you try:
                a. Make the minimal change that resolves it.
                b. Run `npm run lint` and `npx tsc --noEmit`. If
                   either fails, REVERT and skip the ticket.
                c. Create a fresh branch: `auto/<ticketId>`
                d. Commit:
                     `fix: <short title> (auto-triage #<ticketId>)`
                e. Stop. The next workflow step opens the PR.
            - DO NOT push to main. DO NOT modify CLAUDE.md or
              schema.prisma. DO NOT delete any files.
            - When in doubt, skip and leave a clear reason.

            REPORT:
            Write /tmp/triage/result.json with
              {
                "attempted": [ticketId, ...],
                "skipped":   [{id, reason}, ...],
                "branches":  ["auto/<id>", ...]
              }
            so the PR step + callback step can use it.
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          MAX_AUTO_PRS: ${{ env.MAX_AUTO_PRS }}

      # ────────────────────────────────────────────────────────────
      # 4. Open one PR per branch Claude created.
      # ────────────────────────────────────────────────────────────
      - name: Open PRs for each branch
        id: prs
        if: steps.fetch.outputs.newCount != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          PRS_OPENED=0
          PR_URLS=""

          if [ ! -f /tmp/triage/result.json ]; then
            echo "Claude didn't produce a result.json — nothing to PR."
            echo "prsOpened=0" >> "$GITHUB_OUTPUT"
            echo "prUrls=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          BRANCHES=$(git branch --list 'auto/*' --format='%(refname:short)')
          if [ -z "$BRANCHES" ]; then
            echo "No auto/* branches — Claude skipped everything."
            echo "prsOpened=0" >> "$GITHUB_OUTPUT"
            echo "prUrls=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          for branch in $BRANCHES; do
            echo "::group::Opening PR for $branch"
            git push --force --set-upstream origin "$branch" || {
              echo "::warning::push failed for $branch — skipping"
              echo "::endgroup::"
              continue
            }

            TICKET_ID="${branch#auto/}"
            TITLE=$(jq -r --arg id "$TICKET_ID" '.reports[] | select(.id==$id) | .title' /tmp/triage/tickets.json)
            DESC=$(jq -r --arg id "$TICKET_ID" '.reports[] | select(.id==$id) | .description' /tmp/triage/tickets.json)
            CATEGORY=$(jq -r --arg id "$TICKET_ID" '.reports[] | select(.id==$id) | .category' /tmp/triage/tickets.json)
            REPORTER=$(jq -r --arg id "$TICKET_ID" '.reports[] | select(.id==$id) | (.user.name // .userName // .userEmail // "anon")' /tmp/triage/tickets.json)

            PR_BODY=$(cat <<EOF
          **Auto-triage attempt** — ticket \`$TICKET_ID\` ($CATEGORY)

          > **Reporter:** $REPORTER
          >
          > $DESC

          ---

          - Generated by \`.github/workflows/auto-triage.yml\`
          - Lint + tsc passed locally before commit
          - Review carefully — auto-PRs occasionally get intent right but implementation wrong
          - To reject: close. To merge: Squash & Merge.

          Triage queue: ${ATLAS_BASE_URL}/admin/feedback?focus=$TICKET_ID
          Run: ${RUN_URL}
          EOF
          )

            PR_URL=$(gh pr create \
              --base main \
              --head "$branch" \
              --title "fix: ${TITLE} (auto-triage #${TICKET_ID})" \
              --body "$PR_BODY" \
              --label auto-triage 2>&1 | tail -1) || {
                # PR already exists — refresh body via edit
                gh pr edit "$branch" --body "$PR_BODY" || echo "::warning::could not edit PR for $branch"
                PR_URL=$(gh pr view "$branch" --json url --jq .url 2>/dev/null || echo "")
              }
            PRS_OPENED=$((PRS_OPENED + 1))
            PR_URLS="$PR_URLS $PR_URL"
            echo "::endgroup::"
          done

          echo "prsOpened=$PRS_OPENED" >> "$GITHUB_OUTPUT"
          # Trim leading space
          echo "prUrls=$(echo $PR_URLS | xargs)" >> "$GITHUB_OUTPUT"

      # ────────────────────────────────────────────────────────────
      # 5. POST callback to Atlas so the dashboard knows we ran.
      # ────────────────────────────────────────────────────────────
      - name: Callback to Atlas triage-status
        if: always()
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set +e
          ATTEMPTED_IDS="[]"
          SKIPPED="[]"
          ATTEMPTED_COUNT=0
          SKIPPED_COUNT=0
          if [ -f /tmp/triage/result.json ]; then
            ATTEMPTED_IDS=$(jq -c '.attempted // []' /tmp/triage/result.json)
            SKIPPED=$(jq -c '.skipped // []' /tmp/triage/result.json)
            ATTEMPTED_COUNT=$(jq '.attempted | length' /tmp/triage/result.json)
            SKIPPED_COUNT=$(jq '.skipped | length' /tmp/triage/result.json)
          fi
          NEW_COUNT="${{ steps.fetch.outputs.newCount || 0 }}"
          PRS_OPENED="${{ steps.prs.outputs.prsOpened || 0 }}"
          PR_URLS_RAW="${{ steps.prs.outputs.prUrls || '' }}"
          # Convert space-separated PR URLs to JSON array.
          PR_URLS_JSON=$(echo "$PR_URLS_RAW" | tr ' ' '\n' | jq -R . | jq -sc 'map(select(length>0))' || echo "[]")
          ERROR_MSG=""
          if [ "${{ job.status }}" = "failure" ]; then
            ERROR_MSG="Workflow job failed. See run logs."
          fi
          BODY=$(jq -n \
            --arg runUrl "$RUN_URL" \
            --argjson newTicketCount "$NEW_COUNT" \
            --argjson ticketsAttempted "$ATTEMPTED_COUNT" \
            --argjson ticketsSkipped "$SKIPPED_COUNT" \
            --argjson prsCreated "$PRS_OPENED" \
            --argjson attemptedIds "$ATTEMPTED_IDS" \
            --argjson skippedReasons "$SKIPPED" \
            --argjson prUrls "$PR_URLS_JSON" \
            --arg errorMessage "$ERROR_MSG" \
            '{runUrl:$runUrl,newTicketCount:$newTicketCount,ticketsAttempted:$ticketsAttempted,ticketsSkipped:$ticketsSkipped,prsCreated:$prsCreated,attemptedIds:$attemptedIds,skippedReasons:$skippedReasons,prUrls:$prUrls,errorMessage:($errorMessage | select(length>0))}')
          curl -sS -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            "$ATLAS_BASE_URL/api/cron/triage-callback" \
            > /tmp/triage/callback-response.json 2>&1 || true
          cat /tmp/triage/callback-response.json

      # ────────────────────────────────────────────────────────────
      # 6. Run summary panel so a glance at the Actions tab tells
      # you what happened.
      # ────────────────────────────────────────────────────────────
      - name: Workflow run summary
        if: always()
        run: |
          ATTEMPTED_COUNT=0
          SKIPPED_COUNT=0
          if [ -f /tmp/triage/result.json ]; then
            ATTEMPTED_COUNT=$(jq '.attempted | length' /tmp/triage/result.json)
            SKIPPED_COUNT=$(jq '.skipped | length' /tmp/triage/result.json)
          fi
          PRS_OPENED="${{ steps.prs.outputs.prsOpened || 0 }}"
          PR_URLS="${{ steps.prs.outputs.prUrls || '' }}"
          NEW_COUNT="${{ steps.fetch.outputs.newCount || 0 }}"
          {
            echo "## Auto-triage run summary"
            echo ""
            echo "| metric | value |"
            echo "| --- | --- |"
            echo "| NEW tickets fetched | $NEW_COUNT |"
            echo "| tickets attempted   | $ATTEMPTED_COUNT |"
            echo "| tickets skipped     | $SKIPPED_COUNT |"
            echo "| PRs opened          | $PRS_OPENED |"
            echo ""
            if [ -n "$PR_URLS" ]; then
              echo "### PRs"
              for url in $PR_URLS; do echo "- $url"; done
            fi
            if [ -f /tmp/triage/result.json ]; then
              SKIPPED_REASONS=$(jq -r '.skipped[] | "- \(.id): \(.reason)"' /tmp/triage/result.json 2>/dev/null || echo "")
              if [ -n "$SKIPPED_REASONS" ]; then
                echo ""
                echo "### Skipped reasons"
                echo "$SKIPPED_REASONS"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # ────────────────────────────────────────────────────────────
      # 7. If any prior step failed, dump everything we have so the
      # log isn't just "step failed" without context.
      # ────────────────────────────────────────────────────────────
      - name: Failure forensics
        if: failure()
        run: |
          echo "::error::auto-triage workflow failed — dumping diagnostic state"
          echo "::group::tickets.json"
          [ -f /tmp/triage/tickets.json ] && cat /tmp/triage/tickets.json || echo "(missing)"
          echo "::endgroup::"
          echo "::group::result.json"
          [ -f /tmp/triage/result.json ] && cat /tmp/triage/result.json || echo "(missing)"
          echo "::endgroup::"
          echo "::group::callback-response.json"
          [ -f /tmp/triage/callback-response.json ] && cat /tmp/triage/callback-response.json || echo "(missing)"
          echo "::endgroup::"
          echo "::group::git status"
          git status || true
          echo "::endgroup::"
          echo "::group::git branches"
          git branch --list 'auto/*' || true
          echo "::endgroup::"
